<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>富霖新材运营看板平台</title>
<style>
:root{
  --bg:#f5f6f8; --panel:#ffffff; --side:#fafbfc; --line:#e4e7ec; --line-soft:#eef0f3;
  --text:#1f2733; --text-2:#5a6472; --text-3:#9aa3af;
  --brand:#185FA5; --brand-soft:#e6f1fb; --brand-line:#b5d4f4;
  --danger:#c0392b; --danger-soft:#fcecea;
  --ok:#0f6e56; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- 顶栏 ---------- */
.topbar{
  height:52px;flex:none;display:flex;align-items:center;gap:14px;
  padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand-mark{width:36px;height:26px;padding:0 1px;border-radius:7px;background:var(--brand);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;letter-spacing:.5px;flex:none}
.brand-name{font-size:15px;font-weight:600;letter-spacing:.2px}
.search-wrap{flex:1;max-width:360px;position:relative}
.search-wrap input{
  width:100%;height:32px;padding:0 12px 0 32px;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);outline:none;
}
.search-wrap input:focus{border-color:var(--brand-line);background:#fff}
.search-ico{position:absolute;left:10px;top:9px;color:var(--text-3);pointer-events:none}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.tbtn{
  height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--text-2);display:flex;align-items:center;gap:6px;
}
.tbtn:hover{border-color:#cfd5dd;color:var(--text)}
.tbtn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.tbtn.primary:hover{background:#144d87}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none}
.sync-dot.ok{background:#1d9e75}.sync-dot.err{background:var(--danger)}

/* ---------- 布局 ---------- */
.layout{flex:1;display:flex;min-height:0}
.sidebar{
  width:236px;flex:none;background:var(--side);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;transition:width .18s ease;
}
.sidebar.hidden{width:0;overflow:hidden;border-right:none}
.side-scroll{flex:1;overflow-y:auto;padding:10px 8px 16px}
.side-foot{flex:none;border-top:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.side-count{font-size:12px;color:var(--text-3)}

.nav-item{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  color:var(--text-2);cursor:pointer;user-select:none;
}
.nav-item:hover{background:#eef1f5}
.nav-item.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav-item.active .avatar{background:var(--brand);color:#fff}
.avatar{
  width:24px;height:24px;border-radius:6px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:12px;font-weight:600;color:#fff;background:#8895a7;
}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-lock{flex:none;color:var(--text-3);display:flex}
.grp-head{
  display:flex;align-items:center;gap:6px;padding:9px 10px 5px;cursor:pointer;
  color:var(--text-3);font-size:12px;user-select:none;
}
.grp-head:hover{color:var(--text-2)}
.chevron{transition:transform .15s ease;flex:none}
.chevron.up{transform:rotate(90deg)}
.grp-body{display:flex;flex-direction:column;gap:1px;margin-bottom:4px}
.grp-body.collapsed{display:none}

/* ---------- 内容区 ---------- */
.content{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.frame-bar{
  height:38px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);
}
.frame-title{font-weight:600;font-size:13px}
.frame-sub{font-size:12px;color:var(--text-3)}
.frame-age{font-size:12px;color:var(--text-3);padding:1px 7px;border-radius:10px;background:var(--bg);white-space:nowrap}
.frame-age.fresh{color:#2E7D5B}
select.mini{height:26px;padding:0 4px;font-family:inherit;cursor:pointer}
.frame-bar .spacer{flex:1}
.frame-host{flex:1;position:relative;min-height:0;background:#fff}
.frame-host iframe{position:absolute;inset:0;width:100%;height:100%;border:none;background:#fff;z-index:1;transform-origin:0 0}
.frame-mask{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;background:var(--panel);text-align:center;padding:24px;z-index:5;
}
.spinner{width:22px;height:22px;border:2px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mask-title{font-size:14px;font-weight:600}
.mask-desc{font-size:13px;color:var(--text-2);max-width:420px}
.mask-actions{display:flex;gap:8px;margin-top:4px}

/* ---------- 首页 ---------- */
.home{padding:22px 24px 28px;overflow-y:auto;flex:1}
.home-head{display:flex;align-items:baseline;gap:10px;margin-bottom:14px}
.home-head h2{font-size:15px;font-weight:600}
.home-head span{font-size:12px;color:var(--text-3)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.board-card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:10px;
  transition:border-color .12s ease,transform .12s ease;
}
.board-card:hover{border-color:var(--brand-line);transform:translateY(-1px)}
.board-card .avatar{width:32px;height:32px;border-radius:8px;font-size:13px}
.card-name{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-meta{font-size:12px;color:var(--text-3);display:flex;align-items:center;gap:5px}
.empty{padding:38px 0;text-align:center;color:var(--text-3);font-size:13px}

/* ---------- 弹层 ---------- */
.overlay{
  position:absolute;inset:0;background:rgba(20,26,35,.42);display:flex;
  align-items:center;justify-content:center;z-index:60;
}
.modal{
  background:var(--panel);border-radius:14px;padding:20px;width:400px;max-width:calc(100vw - 32px);
  box-shadow:0 12px 40px rgba(16,24,40,.18);
}
.modal h3{font-size:15px;font-weight:600;margin-bottom:6px}
.modal p{font-size:13px;color:var(--text-2);margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:5px}
.field input,.field select{
  width:100%;height:34px;padding:0 10px;border:1px solid var(--line);
  border-radius:8px;outline:none;background:#fff;
}
.field input:focus,.field select:focus{border-color:var(--brand-line)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.err-tip{color:var(--danger);font-size:12px;min-height:16px}
.hint{font-size:12px;color:var(--text-3);line-height:1.6}

/* ---------- 管理抽屉 ---------- */
.drawer{
  position:absolute;top:0;right:0;bottom:0;width:520px;max-width:100vw;background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column;z-index:70;
}
.drawer-head{
  flex:none;padding:14px 18px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;
}
.drawer-head h3{font-size:15px;font-weight:600}
.drawer-body{flex:1;overflow-y:auto;padding:14px 18px 20px}
.drawer-foot{
  flex:none;padding:12px 18px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px;background:var(--bg);
}
.admin-grp{border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden}
.admin-grp-head{display:flex;align-items:center;gap:6px;padding:9px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.admin-grp-head input{flex:1;height:28px;padding:0 8px;border:1px solid transparent;border-radius:6px;background:transparent;font-weight:600;font-size:13px;outline:none}
.admin-grp-head input:hover{border-color:var(--line)}
.admin-grp-head input:focus{border-color:var(--brand-line);background:#fff}
.admin-board{padding:10px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:8px}
.admin-board:first-of-type{border-top:none}
.row{display:flex;gap:8px;align-items:center}
.row input[type=text],.row input[type=url],.row input[type=password]{
  flex:1;min-width:0;height:30px;padding:0 9px;border:1px solid var(--line);border-radius:7px;outline:none;background:#fff;font-size:13px;
}
.row input:focus{border-color:var(--brand-line)}
.row select{height:30px;padding:0 6px;border:1px solid var(--line);border-radius:7px;background:#fff;outline:none;font-size:13px}
.mini{
  height:28px;padding:0 9px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);color:var(--text-2);font-size:12.5px;display:flex;align-items:center;gap:5px;flex:none;
}
.mini:hover{border-color:#cfd5dd}
.mini.danger{color:var(--danger);border-color:#f2d4d1}
.mini.danger:hover{background:var(--danger-soft)}
.mini.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.mini.primary:hover{background:#144d87;border-color:#144d87}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;flex:none}
.chk input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
.lock-tip{font-size:11.5px;color:var(--text-3)}
.lock-tip.warn{color:var(--danger)}
.block-hint{
  position:absolute;top:12px;right:12px;z-index:6;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--text-2);max-width:380px;
}
.block-hint .mini{flex:none}
.hint-x{cursor:pointer;color:var(--text-3);padding:0 3px;font-size:14px;flex:none}
.toast{
  position:absolute;left:50%;bottom:28px;transform:translateX(-50%);
  background:#1f2733;color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:90;
}
/* ---------- 幻灯片轮播 ---------- */
.kiosk{position:fixed;inset:0;z-index:120;background:#0e1319;display:flex;flex-direction:column}
.kiosk-bar{
  position:absolute;left:0;right:0;top:0;height:54px;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:linear-gradient(180deg,rgba(0,0,0,.78),rgba(0,0,0,0));color:#fff;
  transition:opacity .25s ease;z-index:5;
}
.kiosk-bottom{
  position:absolute;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;gap:10px;
  padding:0 16px;background:linear-gradient(0deg,rgba(0,0,0,.8),rgba(0,0,0,0));color:#fff;
  transition:opacity .25s ease;z-index:5;
}
.kiosk.idle .kiosk-bar,.kiosk.idle .kiosk-bottom{opacity:0;pointer-events:none}
.kiosk-title{font-size:15px;font-weight:600;max-width:44%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kiosk-sub{font-size:12.5px;opacity:.78;white-space:nowrap}
.kiosk-idx{font-size:12.5px;background:rgba(255,255,255,.16);padding:3px 10px;border-radius:20px;flex:none}
.kbar-btn{
  height:30px;padding:0 11px;border-radius:8px;border:1px solid rgba(255,255,255,.28);
  background:rgba(255,255,255,.10);color:#fff;font-size:12.5px;display:flex;align-items:center;gap:5px;flex:none;
}
.kbar-btn:hover{background:rgba(255,255,255,.22)}
.kbar-btn.primary{background:var(--brand);border-color:var(--brand)}
.kiosk select{
  height:30px;padding:0 6px;border-radius:8px;border:1px solid rgba(255,255,255,.28);
  background:rgba(22,28,36,.92);color:#fff;outline:none;font-size:12.5px;flex:none;
}
.kiosk-progress{position:absolute;left:0;top:0;height:3px;background:var(--brand);width:0;z-index:6}
.kiosk-host{flex:1;position:relative;min-height:0}
.kiosk-host iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff;display:none;transform-origin:0 0}
.kiosk-host iframe.on{display:block}
.kiosk-loading{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;
  color:#b9c4d0;font-size:13px;background:#0e1319;z-index:2;
}
.kiosk-dots{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);flex:none}
.kdot.on{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.slide-pick{max-height:50vh;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin:10px 0 6px}
.slide-pick .sp-grp{padding:8px 10px;font-size:12px;color:var(--text-3);background:var(--bg);border-bottom:1px solid var(--line-soft)}
.slide-pick .sp-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.slide-pick .sp-item:last-child{border-bottom:none}
.slide-pick .sp-item:hover{background:#f7f9fb}
.sp-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.sp-badge{font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.hidden{display:none !important}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" id="brandMark">富霖</div>
      <div class="brand-name" id="brandName">富霖新材运营看板平台</div>
    </div>
    <div class="search-wrap">
      <svg class="search-ico" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" type="text" placeholder="搜索部门或看板…" autocomplete="off">
    </div>
    <div class="topbar-right">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-3);cursor:pointer" id="syncBox" title="点击可重新配置云环境">
        <span class="sync-dot" id="syncDot"></span><span id="syncText">本地模式</span>
      </div>
      <button class="tbtn" id="btnToggleSide" title="收起 / 展开边栏">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M6.5 2.5v11"/>
        </svg>
      </button>
      <button class="tbtn" id="btnSlide" title="按顺序自动轮播选中的看板，播放时无需密码">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 3.5h10v9H3z" opacity=".28"/><path d="M6.5 6l4 2-4 2z"/></svg>
        幻灯片
      </button>
      <button class="tbtn primary" id="btnAdmin">管理</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="side-scroll" id="sideScroll"></div>
      <div class="side-foot">
        <span class="side-count" id="sideCount"></span>
      </div>
    </aside>

    <main class="content">
      <div class="frame-bar hidden" id="frameBar">
        <span class="frame-title" id="frameTitle"></span>
        <span class="frame-sub" id="frameSub"></span>
        <span class="frame-age" id="frameAge"></span>
        <span class="spacer"></span>
        <span class="frame-sub">自动刷新</span>
        <select class="mini" id="autoRefresh" title="定时重新载入看板，以拉取他人改动后的最新数据">
          <option value="0">关</option>
          <option value="2">2 分钟</option>
          <option value="5">5 分钟</option>
          <option value="10" selected>10 分钟</option>
          <option value="30">30 分钟</option>
        </select>
        <select class="mini" id="frameScale" title="若左侧菜单和整个页面都偏大，那是浏览器缩放/显示器缩放造成的，请在浏览器按 Ctrl+0 恢复 100%。这里只负责让看板内容自动缩放到刚好放得下，免去手动放大缩小。">
          <option value="auto" selected>智能适配</option>
          <option value="1">不缩放</option>
          <option value="0.9">90%</option>
          <option value="0.8">80%</option>
          <option value="0.7">70%</option>
          <option value="0.5">50%</option>
        </select>
        <button class="mini" id="btnReload">刷新</button>
        <button class="mini" id="btnExternal">在新窗口打开</button>
        <button class="mini hidden" id="btnAlt" title="切换该看板的官方地址 / 本站点副本">备用版本</button>
        <button class="mini" id="btnReport">打不开？</button>
      </div>
      <div class="frame-host" id="frameHost"></div>
      <div class="home" id="homeView"></div>
    </main>
  </div>

  <div id="kiosk" class="kiosk hidden"></div>
  <div id="layer"></div>
</div>

function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){

  });

function loadScript(src){
  return new Promise(function(resolve, reject){

    s.src = src; s.onload = resolve; s.onerror = function(){ reject(new Error(src)); };
    document.head.appendChild(s);
  });
}
async function sha256(str){
  try{
    if (window.crypto && crypto.subtle){
      var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }
  }catch(e){}
  return 'plain:' + str;
}
async function verifyPwd(input, stored){
  if (!stored) return true;
  if (String(stored).indexOf('plain:') === 0) return input === stored.slice(6);
  return (await sha256(input)) === stored;
}

async function initCloud(silent){
  var env = localStorage.getItem(LS_ENV) || DEFAULT_ENV || '';
  if (!env){
    state.cloud = { ready:false, reason:'未配置云环境', db:null };
    renderSync(); return false;
  }
  var CB = window.cloudbase || window.tcb;
  if (!CB){
    for (var i=0;i<SDK_CDNS.length;i++){
      try{ await loadScript(SDK_CDNS[i]); CB = window.cloudbase || window.tcb; if (CB) break; }catch(e){}
    }
  }
  if (!CB){
    state.cloud = { ready:false, reason:'云开发 SDK 加载失败', db:null };
    renderSync(); return false;
  }
  try{
    var app = CB.init({ env: env });
    var auth = app.auth({ persistence: 'local' });
    if (!auth.getLoginState || !auth.getLoginState()){
      await auth.signInAnonymously();
    }
    var db = app.database();
    state.cloud = { ready:true, reason:'云端已同步', db:db, collError:'' };
    try{
      await db.collection(COLL).limit(1).get();
    }catch(e){
      state.cloud.collError = (e && e.message) ? e.message : '集合不可访问';
      state.cloud.reason = '云端已连接，但集合 ' + COLL + ' 不可访问（需在控制台新建并设为「所有用户可读写」）';
    }
    renderSync(); return true;
  }catch(e){
    state.cloud = { ready:false, reason:'云端不可用：' + (e && e.message ? e.message : '未知错误'), db:null };
    if (!silent) console.warn('[boardhub] cloud init failed', e);
    renderSync(); return false;
  }

async function syncConfigOnce(){
  if (!state.cloud.ready || layerOpen()) return false;
  if (slide && slide.on) return false;               // 幻灯片播放中不被打断
  try{
    var res = await state.cloud.db.collection(COLL).doc(DOC_ID).get();
    var doc = res && res.data;
    if (doc && doc.length) doc = doc[0];
    if (!doc || !doc.groups) return false;
    if (doc.updatedAt && state.config.updatedAt){
      if (String(doc.updatedAt) === String(state.config.updatedAt)) return false;
      if (new Date(doc.updatedAt) <= new Date(state.config.updatedAt)) return false;
    }
    var before = boardMap();
    var incoming = normalize(doc);
    state.config = incoming;
    localStorage.setItem(LS_CFG, JSON.stringify(state.config));

    // 网址变了 / 被删了 / 新加锁了，都要让旧 iframe 失效
    var after = boardMap();
    Object.keys(before).forEach(function(id){
      var a = after[id];
      if (!a || a.url !== before[id].url) dropFrame(id);
      if (a && a.locked && !before[id].locked) delete state.unlocked[id];
    });
    if (state.view !== 'home' && !findBoard(state.view)){
      showHome(); toast('有人移除了当前看板，已返回总览');
    }else{
      if (state.view === 'home'){ renderHome(); }

var LS_REFRESH = 'boardhub_autorefresh_v1';
var STALE_MS = 4 * 60 * 1000;   // 切回某看板时，超过这个时长自动重新载入
var autoTimer = null, ageTimer = null;

function autoMinutes(){
  var v = localStorage.getItem(LS_REFRESH);
  if (v === null) return 10;
  return parseInt(v, 10) || 0;
}
function setFrameSrc(f, url){
  // 赋相同 src 不会触发重载，先置空确保真正重新导航
  if (f.getAttribute('src') === url) f.setAttribute('src', 'about:blank');
  f.dataset.loadedAt = Date.now();
  f.setAttribute('src', url);
}
function isStale(){
  var s = Number(frameCache[state.view] && frameCache[state.view].dataset.loadedAt || 0);
  return s && (Date.now() - s > STALE_MS);
}
/* ==================== 浏览器 / 屏幕适配 ====================
   各个看板本身是按约 1400px 宽设计的桌面页面。若屏幕较小、或 Windows 显示缩放
    / 浏览器缩放较大（125% / 150%），CSS 可用宽度会变小，看板内容放不下就显得"很大"，
   只能手动缩放浏览器。这里把 iframe 整体缩放到刚好放得下，与屏幕/缩放无关。   */
var LS_SCALE = 'boardhub_scale_v1';
function scaleMode(){
  try{ return localStorage.getItem(LS_SCALE) || 'auto'; }catch(e){ return 'auto'; }
}
function applyFrameScale(el, s){
  if (!el) return;
  if (!s || s >= 0.999){
    el.style.width = '100%'; el.style.height = '100%'; el.style.transform = '';
  }else{
    el.style.width = (100 / s) + '%';
    el.style.height = (100 / s) + '%';
    el.style.transform = 'scale(' + s + ')';
  }
  el.dataset.scale = String(s || 1);
}
/* 先看 contented 文档的真实宽度；跨域页面读不到，就交给用户手动选 */
function innerNaturalWidth(el){
  try{
    var d = el.contentDocument;
    if (!d) return 0;
    var de = d.documentElement, body = d.body;
    var w = Math.max(
      de ? de.scrollWidth : 0,
      body ? body.scrollWidth : 0,
      body ? (body.firstElementChild ? body.firstElementChild.scrollWidth : 0) : 0
    );
    return w || 0;
  }catch(e){ return 0; }
}
function fitFrame(el){
  if (!el || !el.parentElement) return;
  var mode = scaleMode();
  if (mode !== 'auto'){ applyFrameScale(el, parseFloat(mode)); return; }
  /* 量宽度前先复位成 100%，否则会形成"越缩越窄"的反馈循环 */
  applyFrameScale(el, 1);
  var avail = el.parentElement.clientWidth;
  var natural = innerNaturalWidth(el);
  if (!avail || !natural){ return; }
  var s = avail / natural;
  if (s > 1) s = 1;
  if (s < 0.4) s = 0.4;
  applyFrameScale(el, s);
}
var fitTimers = [];
function scheduleFit(el){
  fitTimers.forEach(clearTimeout); fitTimers = [];
  [400, 1500, 3500, 7000].forEach(function(ms){
    fitTimers.push(setTimeout(function(){ fitFrame(el); }, ms));
  });
}
function ensureFrame(b, force){
  var host = $('frameHost');
  var f = frameCache[b.id];
  if (!f){
    f = document.createElement('iframe');
    f.setAttribute('referrerpolicy', 'no-referrer');
    f.dataset.bid = b.id;
    f.dataset.loaded = '0';
    f.onload = function(){
      f.dataset.loaded = '1';
      f.dataset.loadedAt = Date.now();
      clearTimeout(frameTimers[b.id]);
      if (state.view === b.id){ clearMask(); showBlockHint(b); renderAge(); }
      /* 看板多为定宽设计，载入后按可用宽度缩放到刚好放得下 */
      fitFrame(f); scheduleFit(f);
    };
    host.appendChild(f);
    frameCache[b.id] = f;
  }
  var srcNow = f.getAttribute('src');
  var stale = force || (srcNow && f.dataset.loadedAt && (Date.now() - Number(f.dataset.loadedAt) > STALE_MS));
  if (srcNow !== boardUrl(b) || stale){
    f.dataset.loaded = '0';
    setFrameSrc(f, boardUrl(b));
  }
  f.style.display = 'block';
  if (f.dataset.loaded !== '1') showLoadingMask(b); else clearMask();
}
function reloadFrame(b){
  var f = frameCache[b.id];
  if (!f){ ensureFrame(b); return; }
  f.dataset.loaded = '0';
  setFrameSrc(f, boardUrl(b));
  showLoadingMask(b);
  toast('正在拉取最新数据…');
}
function reloadCurrent(){          // 切回已加载过的看板时的后台刷新
  var f = findBoard(state.view);
  if (!f || f.board.mode === 'new') return;
  if (f.board.locked && !state.unlocked[f.board.id]) return;
  if (!f.board.url) return;
  reloadFrame(f.board);
}
function fmtAge(ts){
  if (!ts) return '未载入';
  var s = Math.floor((Date.now() - ts) / 1000);
  if (s < 45) return '刚刚更新';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前更新';
  var h = Math.floor(s / 3600);
  if (h < 24) return h + ' 小时前更新';
  return Math.floor(h / 24) + ' 天前更新';
}
function renderAge(){
  var el = $('frameAge'); if (!el) return;
  var f = frameCache[state.view];
  if (!f || f.dataset.loaded !== '1'){ el.textContent = ''; return; }
  el.textContent = fmtAge(Number(f.dataset.loadedAt));
  el.className = 'frame-age' + ((Date.now() - Number(f.dataset.loadedAt)) < 5 * 60 * 1000 ? ' fresh' : '');
}
function startAutoRefresh(b){
  clearInterval(autoTimer); clearInterval(ageTimer);
  ageTimer = setInterval(renderAge, 30000);
  var m = autoMinutes();
  if (!m || !b.url || b.mode === 'new') return;
  autoTimer = setInterval(function(){
    if (state.view !== b.id) return;
    if (document.hidden) return;          // 不在前台就不打断
    if (layerOpen()) return;              // 开着管理面板时不打扰
    reloadFrame(b);
  }, m * 60 * 1000);
}
function layerOpen(){ var l = $('layer'); return l && l.innerHTML.trim() !== ''; }
function dropFrame(id){
  var f = frameCache[id];
  if (f && f.parentNode) f.parentNode.removeChild(f);
  delete frameCache[id];
  clearTimeout(frameTimers[id]);
}
var LS_CBHINT = 'boardhub_cbhint_v1';
/* 云开发测试域名首次访问会有「风险提醒」页，点一次即可长期放行 —— 提前告知，避免被当成故障 */
function showAccessHint(b){
  if (!isCloudHost(boardUrl(b))) return;
  var flag = null;
  try{ flag = localStorage.getItem(LS_CBHINT); }catch(e){}
  if (flag === 'done') return;
  var host = $('frameHost');
  if (!host || host.querySelector('.access-hint')) return;
  Array.prototype.forEach.call(host.querySelectorAll('.block-hint:not(.access-hint)'), function(x){ x.remove(); });
  var d = document.createElement('div');
  d.className = 'block-hint access-hint';
  d.style.maxWidth = '460px';
  d.innerHTML = '<span>首次显示「风险提醒」时，点页面里的「确定访问」即可（每个看板首次各点一次，之后本机自动放行）</span>' +
    '<button class="mini" id="cbHintOpen">去激活</button>' +
    '<button class="mini" id="cbHintOk">知道了</button>' +
    '<span class="hint-x" id="cbHintX">&#215;</span>';
  host.appendChild(d);
  var close = function(){
    try{ localStorage.setItem(LS_CBHINT, 'done'); }catch(e){}
    if (d.parentNode) d.remove();
  };
  $('cbHintOk').onclick = close;
  $('cbHintX').onclick = close;
  $('cbHintOpen').onclick = function(){
    window.open(boardUrl(b), '_blank', 'noopener');
    setTimeout(close, 1500);
  };
}
function showBlockHint(b){
  if (!b.url || state.hintShown[b.id]) return;
  state.hintShown[b.id] = true;
  var host = $('frameHost');
  if (host.querySelector('.block-hint')) return;
  var d = document.createElement('div');
  d.className = 'block-hint';
  d.innerHTML = '<span>若看板区域空白，说明当前浏览器限制了内嵌</span>' +
    '<button class="mini" id="hintNew">新窗口打开</button>' +
    '<button class="mini" id="hintAlways">始终用新窗口</button>' +
    '<span class="hint-x" id="hintX">&#215;</span>';
  host.appendChild(d);
  var t = setTimeout(function(){ if (d.parentNode) d.remove(); }, 10000);
  $('hintX').onclick = function(){ clearTimeout(t); d.remove(); };
  $('hintNew').onclick = function(){ clearTimeout(t); window.open(boardUrl(b), '_blank', 'noopener'); };
  $('hintAlways').onclick = async function(){
    clearTimeout(t); d.remove();
    b.mode = 'new';
    await pushToCloud();
    renderFrame();
    toast('已设为始终用新窗口打开');
  };
}

function renderFrame(viaUser){
  clearInterval(autoTimer); clearInterval(ageTimer);
  var f = findBoard(state.view);
  if (!f){ showHome(); return; }
  var b = f.board;
  hideAllFrames();
  clearMask();
  $('homeView').classList.add('hidden');
  $('frameHost').classList.remove('hidden');
  $('frameBar').classList.remove('hidden');
  $('frameTitle').textContent = b.name;
  $('frameSub').textContent = f.group.name;
  $('btnExternal').onclick = function(){ window.open(boardUrl(b), '_blank', 'noopener'); };
  $('btnReload').onclick = function(){ reloadFrame(b); };
  var altBtn = $('btnAlt');
  if (altBtn){
    if (b.alt){
      altBtn.classList.remove('hidden');
      /* 按钮文案始终描述"点下去会切到哪边"：目标是相对路径=本站点副本，否则=官方在线版 */
      var tgt = b._useAlt ? b.url : b.alt;
      var tgtIsLocal = !/^https?:/i.test(String(tgt || ''));
      /* 不可编辑的内嵌副本 vs 可编辑的官方原页面，说人话就好懂 */
      altBtn.textContent = tgtIsLocal ? '内嵌副本' : '官方原版';
      altBtn.className = 'mini' + (b._useAlt ? ' primary' : '');
      altBtn.title = tgtIsLocal
        ? '当前看的是「官方原版」——由原平台托管的原始页面，可以编辑数据。点此切到「内嵌副本」：嵌在本页面里显示，同样实时同步，但只读。'
        : '当前看的是页面里的一份内嵌副本：数据和官方实时一致，但不能编辑。点此切到「官方原版」（可以编辑数据）。';
      altBtn.onclick = function(){
        b._useAlt = !b._useAlt;
        dropFrame(b.id);
        openBoard(b.id, true);
        toast(tgtIsLocal ? '已切到本站点副本：内嵌显示，数据仍云端同步' : '已切到官方在线地址');
      };
    }else{
      altBtn.classList.add('hidden');
    }
  }
  var sel = $('autoRefresh');
  if (sel){
    sel.value = String(autoMinutes());
    sel.onchange = function(){
      localStorage.setItem(LS_REFRESH, sel.value);
      startAutoRefresh(b);
      toast(sel.value === '0' ? '已关闭自动刷新' : '每 ' + sel.value + ' 分钟自动拉取最新数据');
    };
  }
  var scSel = $('frameScale');
  if (scSel){
    scSel.value = scaleMode();
    scSel.onchange = function(){
      try{ localStorage.setItem(LS_SCALE, scSel.value); }catch(e){}
      var cur = frameCache[b.id];
      if (cur){ fitFrame(cur); scheduleFit(cur); }
      toast(scSel.value === 'auto' ? '已设为智能适配：按可用宽度自动缩放' : '已设为固定 ' + Math.round(parseFloat(scSel.value) * 100) + '%');
    };
  }

  if (b.mode === 'new'){
    // 此类站点禁止被外站内嵌（frame-ancestors 校验整条祖先链），只能在顶层窗口打开。
    // 用户主动点击时直接弹出新标签页，省掉"再按一次按钮"的步骤；弹窗被拦截时给出按钮兜底。
    var _nw = viaUser ? window.open(boardUrl(b), '_blank', 'noopener') : null;
    renderMask('「' + b.name + '」在新窗口打开',
      _nw ? '已在新的浏览器标签页打开，切过去即可查看。'
          : '这个站点限制了页面内嵌，请点下方按钮打开。',
      b, false);
    return;
  }
  if (b.locked && !state.unlocked[b.id]){
    renderMask('此看板需要密码', '请输入管理员为该看板设置的访问密码。', b, true);
    return;
  }
  if (!b.url){
    renderMask('尚未配置网址', '进入「管理」为「' + b.name + '」填写看板网址。', b, false);
    return;
  }
  ensureFrame(b);
  showAccessHint(b);
  startAutoRefresh(b);
  renderAge();
}
function renderMask(title, desc, b, needPwd){
  var host = $('frameHost');
  clearMask();
  var d = document.createElement('div');
  d.className = 'frame-mask';
  var inner = '<div class="mask-title">' + esc(title) + '</div>' +
    '<div class="mask-desc">' + esc(desc) + '</div><div class="mask-actions">';
  if (needPwd){
    inner += '<input type="password" id="pwdInput" placeholder="访问密码" style="height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;outline:none;width:180px">' +
      '<button class="mini" id="pwdOk" style="background:var(--brand);color:#fff;border-color:var(--brand)">解锁</button>';
  }
  if (b.url) inner += '<button class="mini" id="maskExt">在新窗口打开</button>';
  inner += '</div><div class="err-tip" id="pwdErr"></div>';
  d.innerHTML = inner;
  host.appendChild(d);
  var ext = $('maskExt');
  if (ext) ext.onclick = function(){ window.open(boardUrl(b), '_blank', 'noopener'); };
  var ok = $('pwdOk');
  if (ok){
    var input = $('pwdInput');
    input.onkeydown = function(e){ if (e.key === 'Enter') ok.click(); };
    setTimeout(function(){ input.focus(); }, 50);
    ok.onclick = async function(){
      var passed = await verifyPwd(input.value, b.pwd);
      if (passed){
        state.unlocked[b.id] = true;
        try{ sessionStorage.setItem(SS_UNLOCK, JSON.stringify(state.unlocked)); }catch(e){}
        openBoard(b.id, true);
      }else{
        $('pwdErr').textContent = '密码不正确';
      }
    };
  }
}

function showHome(){
  state.view = 'home';
  hideAllFrames();
  clearMask();
  $('frameBar').classList.add('hidden');
  $('frameHost').classList.add('hidden');
  $('homeView').classList.remove('hidden');
  renderHome(); renderSidebar();
}
function openBoard(id, force, viaUser){
  if (!force && state.view === id) return;
  state.view = id;
  $('homeView').classList.add('hidden');
  renderFrame(viaUser); renderSidebar();
}
function renderAll(){
  $('brandName').textContent = state.config.title || '富霖新材运营看板平台';
  $('brandMark').textContent = (state.config.logo || state.config.title || '富霖').trim().slice(0, 4);
  document.title = state.config.title || '富霖新材运营看板平台';
  if (state.view !== 'home' && !findBoard(state.view)) state.view = 'home';
  if (state.view === 'home'){
    hideAllFrames();
    clearMask();
    $('frameBar').classList.add('hidden');
    $('frameHost').classList.add('hidden');
    $('homeView').classList.remove('hidden');
    renderHome();
  }else{
    renderFrame();
  }
  renderSidebar();
}

/* ==================== 弹层 ==================== */
function closeLayer(){ $('layer').innerHTML = ''; }
function overlay(inner, onBg){
  var html = '<div class="overlay" id="ov">' + inner + '</div>';
  $('layer').innerHTML = html;
  var ov = $('ov');
  ov.addEventListener('mousedown', function(e){ if (e.target === ov && onBg) onBg(); });
  return ov;
}

  overlay(
    '<div class="modal"><h3>进入管理模式</h3><p>管理模式可增删部门、修改网址与密码、排布首页卡片。</p>' +
    '<div class="field"><label>管理员密码</label><input type="password" id="apInput" autocomplete="off"></div>' +

function cloudSetupGuide(){

  );

/* ==================== 管理抽屉 ==================== */
function openAdmin(){
  var html = '<div class="drawer" id="drawer">' +
    '<div class="drawer-head"><h3>管理模式</h3><span class="spacer" style="flex:1"></span>' +
    '<button class="mini" id="adLogout">退出</button><button class="mini" id="adClose">关闭</button></div>' +
    '<div class="drawer-body" id="adBody"></div>' +
    '<div class="drawer-foot">' +
    '<button class="mini" id="adSave" style="background:var(--brand);color:#fff;border-color:var(--brand)">保存并同步</button>' +
    '<button class="mini" id="adAddGrp">添加分组</button>' +
    '<span class="spacer" style="flex:1"></span>' +
    '<button class="mini" id="adExport">导出</button>' +
    '<button class="mini" id="adImport">导入</button>' +
    '<button class="mini" id="adPwd">改管理员密码</button>' +
    '</div></div>';
  $('layer').innerHTML = html;
  $('adClose').onclick = function(){ discardPending(); closeLayer(); renderAll(); };
  $('adLogout').onclick = function(){ discardPending(); state.admin = false; closeLayer(); renderAll(); };
  $('adSave').onclick = saveAdmin;
  $('adAddGrp').onclick = function(){
    state.config.groups.push({ id: uid('g'), name:'新分组', collapsed:false, boards:[] });
    renderAdminBody();
  };
  $('adExport').onclick = function(){
    var blob = new Blob([JSON.stringify(cleanConfig(state.config), null, 2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'board-hub-config.json';
    a.click();
  };
  $('adImport').onclick = function(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function(){
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = async function(){
        try{
          var cfg = normalize(cleanConfig(JSON.parse(r.result)));
          if (!confirm('导入将覆盖当前全部配置，确定继续？')) return;
          state.config = cfg;
          await pushToCloud();
          renderAdminBody(); renderAll();
          toast('已导入');
        }catch(e){ alert('文件格式不正确'); }
      };
      r.readAsText(f);
    };
    inp.click();
  };
  $('adPwd').onclick = changeAdminPwd;
  renderAdminBody();
}

function bindAdminInputs(){
  var body = $('adBody');
  var title = body.querySelector('#adTitle');
  title.oninput = function(){ state.config.title = title.value; };
  var logo = body.querySelector('#adLogo');
  if (logo) logo.oninput = function(){ state.config.logo = logo.value.trim() || (state.config.title || '富霖').trim().slice(0, 4); };

  body.querySelectorAll('[data-gname]').forEach(function(el){
    el.oninput = function(){
      var g = state.config.groups.filter(function(x){ return x.id === el.getAttribute('data-gname'); })[0];
      if (g) g.name = el.value;
      renderSidebar();
    };
  });
  body.querySelectorAll('[data-bname]').forEach(function(el){
    el.oninput = function(){
      var f = findBoard(el.getAttribute('data-bname'));
      if (f){ f.board.name = el.value; renderSidebar(); }
    };
  });
  body.querySelectorAll('[data-burl]').forEach(function(el){
    el.oninput = function(){
      var f = findBoard(el.getAttribute('data-burl'));
      if (f) f.board.url = el.value.trim();
    };
  });
  body.querySelectorAll('[data-bcolor]').forEach(function(el){
    el.onchange = function(){
      var f = findBoard(el.getAttribute('data-bcolor'));
      if (f){ f.board.color = el.value; renderSidebar(); }
    };
  });
  body.querySelectorAll('[data-bmode]').forEach(function(el){
    el.onchange = function(){
      var f = findBoard(el.getAttribute('data-bmode'));
      if (f) f.board.mode = el.value;
    };
  });
  body.querySelectorAll('[data-bhome]').forEach(function(el){
    el.onchange = function(){
      var id = el.getAttribute('data-bhome');
      var list = state.config.homeCards || (state.config.homeCards = []);
      if (el.checked){ if (list.indexOf(id) < 0) list.push(id); }
      else { state.config.homeCards = list.filter(function(x){ return x !== id; }); }
      renderHome();
    };
  });
  body.querySelectorAll('[data-bslide]').forEach(function(el){
    el.onchange = function(){
      var id = el.getAttribute('data-bslide');
      var list = state.config.slideCards || (state.config.slideCards = []);
      if (el.checked){ if (list.indexOf(id) < 0) list.push(id); }
      else { state.config.slideCards = list.filter(function(x){ return x !== id; }); }
    };
  });
  body.querySelectorAll('[data-block]').forEach(function(el){
    el.onchange = function(){
      var f = findBoard(el.getAttribute('data-block'));
      if (!f) return;
      f.board.locked = el.checked;
      var tip = body.querySelector('[data-btip="' + f.board.id + '"]');
      if (tip){
        tip.textContent = f.board.locked
          ? (f.board.pwd ? '已设置密码' : '已勾选需要密码，但还没有设置密码 —— 任何人都能直接打开')
          : '无需密码，所有人可直接查看';
        tip.className = 'lock-tip' + (f.board.locked && !f.board.pwd ? ' warn' : '');
      }
      renderSidebar();
    };
  });
  body.querySelectorAll('[data-bpwd]').forEach(function(el){
    el.onchange = function(){
      var f = findBoard(el.getAttribute('data-bpwd'));
      if (!f || !el.value) return;
      if (f.board._origPwd === undefined) f.board._origPwd = f.board.pwd;
      f.board.pwd = 'pending:' + el.value;
      var tip = body.querySelector('[data-btip="' + f.board.id + '"]');
      if (tip){ tip.textContent = '新密码将在点「保存并同步」后生效'; tip.className = 'lock-tip'; }
    };
  });

  body.querySelectorAll('[data-gadd]').forEach(function(el){
    el.onclick = function(){
      var g = state.config.groups.filter(function(x){ return x.id === el.getAttribute('data-gadd'); })[0];
      if (!g) return;
      var nb = { id: uid('b'), name:'新看板', url:'', locked:true, pwd:'plain:1234', color:'blue', mode:'auto' };
      g.boards.push(nb);
      (state.config.slideCards || (state.config.slideCards = [])).push(nb.id);
      renderAdminBody();
    };
  });
  body.querySelectorAll('[data-gdel]').forEach(function(el){
    el.onclick = function(){
      var id = el.getAttribute('data-gdel');
      var g = state.config.groups.filter(function(x){ return x.id === id; })[0];
      if (!g) return;
      if ((g.boards || []).length && !confirm('删除分组「' + g.name + '」会同时删除其下 ' + g.boards.length + ' 个看板，确定？')) return;
      (g.boards || []).forEach(function(b){ dropFrame(b.id); delete state.unlocked[b.id]; });
      state.config.groups = state.config.groups.filter(function(x){ return x.id !== id; });
      renderAdminBody(); renderSidebar();
    };
  });
  body.querySelectorAll('[data-bdel]').forEach(function(el){
    el.onclick = function(){
      var id = el.getAttribute('data-bdel');
      var f = findBoard(id); if (!f) return;
      if (!confirm('删除看板「' + f.board.name + '」？')) return;
      f.group.boards.splice(f.bi, 1);
      dropFrame(id);
      delete state.unlocked[id];
      state.config.homeCards = (state.config.homeCards || []).filter(function(x){ return x !== id; });
      state.config.slideCards = (state.config.slideCards || []).filter(function(x){ return x !== id; });
      if (state.view === id) showHome(); else { renderAdminBody(); renderSidebar(); }
    };
  });
  body.querySelectorAll('[data-gup]').forEach(function(el){
    el.onclick = function(){ moveGroup(parseInt(el.getAttribute('data-gup'),10), -1); };
  });
  body.querySelectorAll('[data-gdown]').forEach(function(el){
    el.onclick = function(){ moveGroup(parseInt(el.getAttribute('data-gdown'),10), 1); };
  });
  body.querySelectorAll('[data-bup]').forEach(function(el){
    el.onclick = function(){ moveBoard(el.getAttribute('data-bup'), -1); };
  });
  body.querySelectorAll('[data-bdown]').forEach(function(el){
    el.onclick = function(){ moveBoard(el.getAttribute('data-bdown'), 1); };
  });
}
function moveGroup(i, d){
  var gs = state.config.groups, j = i + d;
  if (j < 0 || j >= gs.length) return;
  var tmp = gs[i]; gs[i] = gs[j]; gs[j] = tmp;
  renderAdminBody(); renderSidebar();
}
function moveBoard(id, d){
  var f = findBoard(id); if (!f) return;
  if (d < 0 && f.bi === 0){
    if (f.gi === 0) return;
    var prev = state.config.groups[f.gi - 1];
    f.group.boards.splice(f.bi, 1);
    prev.boards.push(f.board);
  }else if (d > 0 && f.bi === f.group.boards.length - 1){
    if (f.gi === state.config.groups.length - 1) return;
    var next = state.config.groups[f.gi + 1];
    f.group.boards.splice(f.bi, 1);
    next.boards.unshift(f.board);
  }else{
    var j = f.bi + d;
    var tmp = f.group.boards[f.bi]; f.group.boards[f.bi] = f.group.boards[j]; f.group.boards[j] = tmp;
  }
  renderAdminBody(); renderSidebar();
}

async function saveAdmin(){

  var boards = allBoards();
  for (var i=0;i<boards.length;i++){
    var b = boards[i];
    if (b.pwd && String(b.pwd).indexOf('pending:') === 0){
      var raw = b.pwd.slice(8);

  var ok = await pushToCloud();
  renderAdminBody();
  renderAll();

}

/* ==================== 幻灯片轮播（免密码、自动播放最新数据） ==================== */
var LS_SLIDE = 'boardhub_slide_sec_v1';
var SLIDE_SECS = [10, 15, 30, 60, 120];
var slide = { on:false, ids:[], i:0, sec:30, tick:null, loadWait:null, idleT:null,
              frames:{}, paused:false, remain:0, startedAt:0, fs:false };

function slideSec(){
  var v = parseInt(localStorage.getItem(LS_SLIDE) || '', 10);
  return (v > 0) ? v : 30;
}
/* 可播放：有网址、且未设为「新窗口打开」 */
function slidePlayable(){
  var out = [];
  (state.config.groups || []).forEach(function(g){
    (g.boards || []).forEach(function(b){
      if (b.url && b.mode !== 'new') out.push(b.id);
    });
  });
  return out;
}
function slideDefaultIds(){
  var ok = slidePlayable();
  var saved = (state.config.slideCards || []).filter(function(id){ return ok.indexOf(id) > -1; });
  return saved.length ? saved : ok;
}
function openSlideSetup(){
  var ok = slidePlayable();
  if (!ok.length){ toast('还没有可播放的看板（需先在「管理」里填网址）'); return; }
  var def = slideDefaultIds();
  var sec = slideSec();
  var secOpts = SLIDE_SECS.map(function(s){
    return '<option value="' + s + '"' + (s === sec ? ' selected' : '') + '>' + s + ' 秒</option>';
  }).join('');

  var html = '<div class="modal" style="width:470px"><h3>幻灯片播放</h3>' +
    '<p>按勾选顺序自动轮播，<b>播放时无需密码</b>，每轮自动重新载入、始终显示最新数据。</p>' +
    '<div class="row"><label class="chk" style="flex:1">每屏停留</label><select id="slSec">' + secOpts + '</select></div>' +
    '<div class="slide-pick" id="slPick">';
  (state.config.groups || []).forEach(function(g){
    var bs = (g.boards || []).filter(function(b){ return b.url && b.mode !== 'new'; });
    if (!bs.length) return;
    html += '<div class="sp-grp">' + esc(g.name) + '</div>';
    bs.forEach(function(b){
      html += '<label class="sp-item"><input type="checkbox" data-sl="' + b.id + '"' +
        (def.indexOf(b.id) > -1 ? ' checked' : '') + '>' + avatarHtml(b) +
        '<span class="sp-name">' + esc(b.name) + '</span>' +
        (b.locked ? '<span class="sp-badge">免密码</span>' : '') + '</label>';
    });
  });
  html += '</div>' +
    '<div class="row" style="margin-top:8px"><button class="mini" id="slAll">全选</button>' +
    '<button class="mini" id="slNone">全不选</button><span style="flex:1"></span>' +
    '<span style="font-size:12px;color:var(--text-3)" id="slCount"></span></div>' +
    '<div class="modal-actions"><button class="mini" id="slCancel">取消</button>' +
    '<button class="mini primary" id="slGo" style="background:var(--brand);color:#fff;border-color:var(--brand)">开始播放</button></div>' +
    '<div class="hint" style="margin-top:10px">快捷键：空格 暂停/继续 · ← → 上一个/下一个 · Esc 退出。默认勾选可在「管理」里逐看板设置。</div></div>';

  overlay(html, closeLayer);
  var pick = $('slPick');
  function count(){
    var n = pick.querySelectorAll('input[data-sl]:checked').length;
    $('slCount').textContent = '已选 ' + n + ' 个';
  }
  pick.onchange = count;
  $('slAll').onclick = function(){ pick.querySelectorAll('input[data-sl]').forEach(function(i){ i.checked = true; }); count(); };
  $('slNone').onclick = function(){ pick.querySelectorAll('input[data-sl]').forEach(function(i){ i.checked = false; }); count(); };
  $('slCancel').onclick = closeLayer;
  count();
  $('slGo').onclick = function(){
    var ids = [];
    pick.querySelectorAll('input[data-sl]').forEach(function(i){ if (i.checked) ids.push(i.getAttribute('data-sl')); });
    if (!ids.length){ toast('请至少勾选一个看板'); return; }
    startSlideshow(ids, parseInt($('slSec').value, 10) || 30);
  };
}

function startSlideshow(ids, sec){
  if (!ids.length) return;
  slide.on = true; slide.ids = ids.slice(); slide.i = 0; slide.sec = sec;
  slide.frames = {}; slide.paused = false; slide.fs = false;
  try{ localStorage.setItem(LS_SLIDE, String(sec)); }catch(e){}
  closeLayer();
  clearInterval(autoTimer); clearInterval(ageTimer);

  var k = $('kiosk');
  var secOpts = SLIDE_SECS.map(function(s){
    return '<option value="' + s + '"' + (s === sec ? ' selected' : '') + '>' + s + ' 秒</option>';
  }).join('');
  k.innerHTML =
    '<div class="kiosk-progress" id="kProg"></div>' +
    '<div class="kiosk-bar">' +
      '<span class="kiosk-title" id="kTitle"></span>' +
      '<span class="kiosk-sub" id="kSub"></span>' +
      '<span class="kiosk-idx" id="kIdx"></span>' +
      '<span style="flex:1"></span>' +
      '<button class="kbar-btn" id="kPrev">← 上一个</button>' +
      '<button class="kbar-btn" id="kNext">下一个 →</button>' +
      '<button class="kbar-btn" id="kPause">暂停</button>' +
      '<button class="kbar-btn" id="kExit">退出 Esc</button>' +
    '</div>' +
    '<div class="kiosk-host" id="kHost">' +
      '<div class="kiosk-loading hidden" id="kLoad">正在载入…</div>' +
    '</div>' +
    '<div class="kiosk-bottom">' +
      '<span class="kiosk-sub" id="kCount"></span>' +
      '<span class="kiosk-dots" id="kDots"></span>' +
      '<span style="flex:1"></span>' +
      '<span class="kiosk-sub">每屏</span><select id="kSec">' + secOpts + '</select>' +
      '<button class="kbar-btn" id="kReload">刷新当前</button>' +
      '<button class="kbar-btn" id="kFs">全屏</button>' +
    '</div>';
  k.classList.remove('hidden');

  $('kPrev').onclick = function(){ slideGo(slide.i - 1); };
  $('kNext').onclick = function(){ slideGo(slide.i + 1); };
  $('kPause').onclick = slideTogglePause;
  $('kExit').onclick = stopSlideshow;
  $('kReload').onclick = function(){ slideLoad(true); };
  $('kFs').onclick = slideToggleFs;
  $('kSec').onchange = function(){
    slide.sec = parseInt($('kSec').value, 10) || 30;
    try{ localStorage.setItem(LS_SLIDE, String(slide.sec)); }catch(e){}
    slideArm();
  };

  document.addEventListener('keydown', slideKey);
  document.addEventListener('mousemove', slideActivity);
  document.addEventListener('fullscreenchange', slideFsChange);
  slideActivity();

  try{
    var p = document.documentElement.requestFullscreen();
    slide.fs = true;
    if (p && p.catch) p.catch(function(){ slide.fs = false; });
  }catch(e){ slide.fs = false; }

  slideGo(0);
}

function slideLoad(force){
  var b = findBoard(slide.ids[slide.i]);
  if (!b) return;
  b = b.board;
  var host = $('kHost');
  var fr = slide.frames[b.id];
  var fresh = false;
  if (!fr){
    fr = document.createElement('iframe');
    fr.setAttribute('referrerpolicy', 'no-referrer');
    fr.dataset.bid = b.id;
    host.appendChild(fr);
    slide.frames[b.id] = fr;
    fresh = true;
  }
  // 只有当前看板的 iframe 可见（新建的也要在这里补上，否则会黑屏）
  Object.keys(slide.frames).forEach(function(id){
    slide.frames[id].classList.toggle('on', id === b.id);
  });
  var loadedAt = Number(fr.dataset.loadedAt || 0);
  // 超过 90 秒或手动刷新 → 重新载入，保证看到的是最新数据
  if (fresh || force || !fr.getAttribute('src') || (Date.now() - loadedAt > 90000)){
    fr.dataset.loaded = '0';
    fr.dataset.loadedAt = Date.now();
    $('kLoad').classList.remove('hidden');
    fr.onload = function(){
      fr.dataset.loaded = '1';
      fr.dataset.loadedAt = Date.now();
      $('kLoad').classList.add('hidden');
      fitFrame(fr); scheduleFit(fr);   /* 幻灯片同样按可用宽度缩放 */
      slideArm();
    };
    fr.setAttribute('src', boardUrl(b));
  }else{
    $('kLoad').classList.add('hidden');
    slideArm();
  }
}
function slideGo(i){
  if (!slide.on) return;
  if (!slide.ids.length) return;
  slide.i = (i + slide.ids.length) % slide.ids.length;
  var f = findBoard(slide.ids[slide.i]);
  if (!f){                                   // 看板被删了就跳过
    slide.ids.splice(slide.i, 1);
    if (!slide.ids.length){ stopSlideshow(); return; }
    slideGo(slide.i); return;
  }
  var b = f.board;
  $('kTitle').textContent = b.name;
  $('kSub').textContent = f.group.name;
  $('kIdx').textContent = (slide.i + 1) + ' / ' + slide.ids.length;
  var dots = '';
  for (var n = 0; n < slide.ids.length; n++) dots += '<span class="kdot' + (n === slide.i ? ' on' : '') + '"></span>';
  $('kDots').innerHTML = dots;
  Object.keys(slide.frames).forEach(function(id){ slide.frames[id].classList.remove('on'); });
  var el = slide.frames[b.id];
  if (el) el.classList.add('on');
  slideLoad(false);
}
function slideArm(){
  clearInterval(slide.tick); clearTimeout(slide.loadWait);
  if (!slide.on) return;
  slide.remain = slide.sec * 1000;
  slide.startedAt = Date.now();
  slide.paused = false;
  var pb = $('kPause'); if (pb) pb.textContent = '暂停';
  slide.tick = setInterval(function(){
    if (!slide.on || slide.paused) return;
    var used = Date.now() - slide.startedAt;
    var p = Math.min(1, used / slide.remain);
    var prog = $('kProg'); if (prog) prog.style.width = (p * 100).toFixed(2) + '%';
    var cd = $('kCount');
    if (cd) cd.textContent = '下一屏 ' + Math.max(0, Math.ceil((slide.remain - used) / 1000)) + ' 秒';
    if (p >= 1){ clearInterval(slide.tick); slideGo(slide.i + 1); }
  }, 200);
}
function slideTogglePause(){
  if (!slide.on) return;
  var used = Date.now() - slide.startedAt;
  if (slide.paused){
    slide.startedAt = Date.now();                    // 继续：从剩余时间接着走
    slide.paused = false;
    $('kPause').textContent = '暂停';
  }else{
    slide.remain = Math.max(1000, slide.remain - used);
    slide.paused = true;
    $('kPause').textContent = '继续';
  }
}
function slideToggleFs(){
  try{
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
  }catch(e){}
}
function slideFsChange(){
  if (slide.on && slide.fs && !document.fullscreenElement) stopSlideshow();
}
function slideActivity(){
  var k = $('kiosk');
  if (!k) return;
  k.classList.remove('idle');
  clearTimeout(slide.idleT);
  slide.idleT = setTimeout(function(){ if (slide.on) k.classList.add('idle'); }, 3500);
}
function slideKey(e){
  if (!slide.on) return;
  if (e.key === 'Escape'){ e.preventDefault(); stopSlideshow(); }
  else if (e.key === ' '){ e.preventDefault(); slideTogglePause(); slideActivity(); }
  else if (e.key === 'ArrowRight'){ e.preventDefault(); slideGo(slide.i + 1); slideActivity(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); slideGo(slide.i - 1); slideActivity(); }
}
function stopSlideshow(){
  if (!slide.on) return;
  slide.on = false;
  clearInterval(slide.tick); clearTimeout(slide.loadWait); clearTimeout(slide.idleT);
  document.removeEventListener('keydown', slideKey);
  document.removeEventListener('mousemove', slideActivity);
  document.removeEventListener('fullscreenchange', slideFsChange);
  slide.frames = {};
  var k = $('kiosk');
  k.innerHTML = '';
  k.classList.add('hidden');
  k.classList.remove('idle');
  try{ if (document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  slide.fs = false;
  if (state.view === 'home') renderAll(); else renderFrame();
}

/* ==================== 启动 ==================== */
(async function boot(){
  try{
    var q = new URLSearchParams(location.search || '');
    if (q.get('resetcfg') === '1'){
      localStorage.removeItem(LS_CFG);
      console.warn('[boardhub] 已清除本机缓存的部门清单，恢复为内置默认清单');
      setTimeout(function(){ toast('已重置为最新内置清单'); }, 900);
    }
  }catch(e){}
  var local = null;
  try{ local = JSON.parse(localStorage.getItem(LS_CFG) || 'null'); }catch(e){}
  if (local && local.groups) state.config = normalize(local);
  renderAll();
  // 大屏常开：地址栏加 ?slide=1 直接进入幻灯片播放（可再加 &sec=60 指定秒数）
  try{
    var qs = new URLSearchParams(location.search || '');
    if (qs.get('slide') === '1'){
      var ssec = parseInt(qs.get('sec') || '', 10) || slideSec();
      setTimeout(function(){ startSlideshow(slideDefaultIds(), ssec); }, 600);
    }
  }catch(e){}
  var okCloud = await initCloud(true);
  if (okCloud){
    var pulled = await pullFromCloud();
    if (pulled) renderAll();
    startConfigSync();
  }else if (localStorage.getItem(LS_ENV)){
    console.warn('[boardhub]', state.cloud.reason);
  }
  // 已内置环境 ID，不再强制弹引导；连接失败时点右上角状态可重新配置
})();
</script>
</body>
</html>
